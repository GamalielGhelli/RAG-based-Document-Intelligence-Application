[project]
name = "estudo-caso"
version = "0.1.0"
description = "Aplicação local para extração, classificação, busca semântica e consulta de documentos PDF."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "pymupdf>=1.28.2",
    "streamlit>=1.61.1",
]
[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"